spring.application.name=stock-alert-monitor
server.port=8081

stock.data.provider=mock
stock.data.api-key=${STOCK_DATA_API_KEY:}
stock.data.base-url=https://www.alphavantage.co
stock.monitor.fixed-rate-ms=21600000

market.api.enabled=false
market.api.key=
market.api.base-url=https://www.alphavantage.co

spring.datasource.url=jdbc:h2:mem:stockalerts;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jackson.serialization.write-dates-as-timestamps=false
